<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Backups - Pil Andina</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
{% include 'shared/navbar.html' %}
<div class="admin-layout">
    <aside class="sidebar">{% include 'admin/sidebar.html' %}</aside>
    <main class="main-content">
        <div class="page-header"><h1>Gestion de Backups</h1></div>

        <div class="card" style="margin-bottom:25px;">
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.crear_backup') }}">
                    <button type="submit" class="btn btn-primary">📥 Generar Nuevo Backup</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3>Backups Existentes</h3></div>
            <div class="card-body">
                <table class="data-table">
                    <tr><th>Nombre</th><th>Tamano (MB)</th><th>Fecha Creacion</th><th>Acciones</th></tr>
                    {% for b in backups %}
                    <tr>
                        <td>{{ b.nombre }}</td>
                        <td>{{ b.tamano_mb }}</td>
                        <td>{{ b.fecha_creacion }}</td>
                        <td><a href="{{ url_for('admin.descargar_backup', nombre=b.nombre) }}" class="btn btn-sm btn-primary">Descargar</a></td>
                    </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
