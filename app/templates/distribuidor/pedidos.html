<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Mis Pedidos - Pil Andina</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
{% include 'shared/navbar.html' %}
<div class="container">
    <div class="page-header"><h1>Mis Pedidos</h1></div>
    <div class="card">
        <div class="card-body">
            <table class="data-table">
                <tr><th>ID</th><th>Fecha Pedido</th><th>Fecha Entrega</th><th>Estado</th><th>Monto Total</th><th>Acciones</th></tr>
                {% for p in pedidos %}
                <tr>
                    <td>#{{ p.id_pedido }}</td>
                    <td>{{ p.fecha_pedido }}</td>
                    <td>{{ p.fecha_entrega_requerida }}</td>
                    <td><span class="badge badge-{% if p.estado=='Entregado' %}success{% elif p.estado=='Pendiente' %}warning{% elif p.estado=='Cancelado' %}danger{% else %}info{% endif %}">{{ p.estado }}</span></td>
                    <td>{{ p.monto_total | format_money }}</td>
                    <td><a href="{{ url_for('distribuidor.ver_pedido', id_pedido=p.id_pedido) }}" class="btn btn-sm btn-secondary">Ver</a></td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
</div>
</body>
</html>
